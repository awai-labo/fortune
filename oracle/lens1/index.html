<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Integration Tree — One Lens</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2308080f'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23c9a84c' stroke-width='4'/%3E%3Cpath d='M32 12v40M18 32h28M23 20l18 24M41 20 23 44' stroke='%23c9a84c' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c9a84c;
      --gold-dim: rgba(201,168,76,0.35);
      --bg: #08080f;
      --text: #e8e0d0;
      --text-dim: rgba(232,224,208,0.4);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Cormorant Garamond', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.5rem 4rem;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(180,140,60,0.10) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 85%, rgba(60,80,160,0.08) 0%, transparent 45%);
      pointer-events: none;
      z-index: 0;
    }

    .wrap { position: relative; z-index: 1; width: 100%; max-width: 540px; }

    header { text-align: center; margin-bottom: 2.2rem; }

    .site-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(10px, 2.5vw, 13px);
      letter-spacing: 0.3em;
      color: var(--gold);
      opacity: 0.85;
      text-transform: uppercase;
    }

    .site-sub {
      font-size: 13px;
      color: var(--text-dim);
      font-style: italic;
      margin-top: 6px;
      letter-spacing: 0.05em;
    }

    .deck-desc {
      font-size: 14px;
      color: var(--text-dim);
      font-style: italic;
      text-align: center;
      line-height: 1.85;
      margin-bottom: 1.8rem;
    }

    .q-area { margin-bottom: 0.5rem; }

    .q-area label {
      display: block;
      font-size: 12px;
      letter-spacing: 0.1em;
      color: var(--gold);
      opacity: 0.75;
      margin-bottom: 8px;
    }

    .q-area textarea {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 0.5px solid var(--gold-dim);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Cormorant Garamond', serif;
      font-size: 17px;
      padding: 12px 16px;
      resize: none;
      outline: none;
      line-height: 1.65;
      transition: border-color 0.3s;
    }

    .q-area textarea::placeholder { color: var(--text-dim); font-style: italic; }
    .q-area textarea:focus { border-color: rgba(201,168,76,0.65); }

    .q-hint {
      font-size: 12px;
      color: #c98080;
      opacity: 0;
      height: 0;
      overflow: hidden;
      margin-top: 6px;
      transition: opacity 0.2s;
    }
    .q-hint.show { opacity: 0.85; height: auto; margin-bottom: 6px; }

    .draw-btn {
      display: block;
      width: 100%;
      background: transparent;
      border: 1px solid rgba(201,168,76,0.45);
      color: var(--gold);
      font-family: 'Cinzel Decorative', serif;
      font-size: 11px;
      letter-spacing: 0.22em;
      padding: 13px;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.3s;
      margin-top: 1.4rem;
      margin-bottom: 2rem;
    }

    .draw-btn:hover { background: rgba(201,168,76,0.07); border-color: var(--gold); }
    .draw-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .card-stage { display: none; }
    .card-stage.visible { display: block; animation: fadeUp 0.8s ease forwards; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .your-q {
      font-size: 14px;
      font-style: italic;
      color: var(--text-dim);
      text-align: center;
      line-height: 1.75;
      margin-bottom: 1.8rem;
      padding: 0 0.5rem;
    }

    .card-wrap { display: flex; flex-direction: column; align-items: center; margin-bottom: 1.8rem; }

    .card-face {
      width: 190px;
      height: 304px;
      border-radius: 11px;
      border: 1px solid rgba(201,168,76,0.38);
      overflow: hidden;
      box-shadow: 0 0 36px rgba(201,168,76,0.13), 0 20px 56px rgba(0,0,0,0.72);
    }

    .card-face svg { width: 100%; height: 100%; display: block; }

    .card-name {
      font-family: 'Cinzel Decorative', serif;
      font-size: 11px;
      letter-spacing: 0.18em;
      color: var(--gold);
      margin-top: 12px;
    }

    .card-type {
      font-size: 13px;
      color: var(--text-dim);
      font-style: italic;
      margin-top: 4px;
    }

    .lens {
      margin-bottom: 1.4rem;
    }

    .lens-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Cinzel Decorative', serif;
      font-size: 10.5px;
      letter-spacing: 0.14em;
      color: var(--gold);
      opacity: 0.9;
      margin-bottom: 10px;
    }

    .lens-label .n {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border: 1px solid var(--gold-dim);
      border-radius: 50%;
      font-size: 10px;
      flex-shrink: 0;
    }

    .lens-box {
      background: rgba(255,255,255,0.025);
      border: 0.5px solid rgba(201,168,76,0.18);
      border-radius: 9px;
      padding: 1.3rem 1.4rem;
    }

    .lens-box.column {
      background: transparent;
      border: none;
      padding: 0.4rem 1.1rem 0;
    }

    .lens-text {
      font-size: 16.5px;
      line-height: 1.95;
      font-weight: 300;
      color: var(--text);
      white-space: pre-wrap;
    }

    .lens.column .lens-text {
      font-size: 14.5px;
      font-style: italic;
      color: var(--text-dim);
      line-height: 1.85;
    }

    .lens-loading {
      text-align: center;
      font-style: italic;
      color: var(--text-dim);
      font-size: 15px;
      padding: 0.6rem 0;
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }

    .again-btn {
      display: block;
      width: 100%;
      background: transparent;
      border: 1px solid var(--gold-dim);
      color: var(--text-dim);
      font-family: 'Cinzel Decorative', serif;
      font-size: 10px;
      letter-spacing: 0.18em;
      padding: 11px;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.3s;
      margin-top: 1.6rem;
    }
    .again-btn:hover { color: var(--gold); border-color: var(--gold); }

    .instagram-link { text-align: center; margin-top: 2rem; }

    .instagram-link a {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--text-dim);
      text-decoration: none;
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      font-style: italic;
      letter-spacing: 0.08em;
      transition: color 0.3s;
    }
    .instagram-link a:hover { color: var(--gold); }
    .instagram-link svg { flex-shrink: 0; }
  </style>
  <meta property="og:title" content="The Integration Tree — One Lens" />
  <meta property="og:description" content="一枚のカードから、今の願いの奥にあるかもしれない思い込みを見にいく、ひとつのレンズ。" />
  <meta property="og:url" content="https://fortune-five-psi.vercel.app/oracle/lens1/" />
  <meta property="og:image" content="https://raw.githubusercontent.com/awai-labo/fortune/main/oracle/images/ogp.png" />
  <meta property="og:type" content="website" />
</head>
<body>
  <div class="wrap">
    <header>
      <p class="site-title">The Integration Tree</p>
      <p class="site-sub">One Lens — ひとつのレンズ</p>
    </header>

    <div id="inputStage">
      <p class="deck-desc">一枚のカードを通して、今かなえたい願い・問いの奥にあるかもしれない思い込みを見にいきます。</p>

      <div class="q-area">
        <label for="userQ">今、問いかけたいこと・叶えたい願い</label>
        <textarea id="userQ" rows="3" placeholder="例）新しい仕事に踏み出したい、この関係をどうしたいか知りたい…"></textarea>
        <p class="q-hint" id="qHint">一行だけでいいので、書いてから引いてください</p>
      </div>

      <button class="draw-btn" id="drawBtn" onclick="drawCard()">✦ カードを引く ✦</button>
    </div>

    <div class="card-stage" id="cardStage">
      <p class="your-q" id="yourQ"></p>

      <div class="card-wrap">
        <div class="card-face" id="cardFace">
          <svg id="cardSvg" viewBox="0 0 200 320" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
        <p class="card-name" id="cardName"></p>
        <p class="card-type" id="cardTypeLabel"></p>
      </div>

      <div class="lens" id="lensBelief">
        <div class="lens-label"><span class="n">1</span>鍵となっていそうな思い込み</div>
        <div class="lens-box">
          <div class="lens-loading" id="loadBelief">受け取り中…</div>
          <div class="lens-text" id="textBelief" style="display:none;"></div>
        </div>
      </div>

      <div class="lens" id="lensBackground">
        <div class="lens-label"><span class="n">2</span>その思い込みができた背景にありそうなもの</div>
        <div class="lens-box">
          <div class="lens-loading" id="loadBackground">受け取り中…</div>
          <div class="lens-text" id="textBackground" style="display:none;"></div>
        </div>
      </div>

      <div class="lens" id="lensView">
        <div class="lens-label"><span class="n">3</span>願いが叶った視点でみてみると</div>
        <div class="lens-box">
          <div class="lens-loading" id="loadView">受け取り中…</div>
          <div class="lens-text" id="textView" style="display:none;"></div>
        </div>
      </div>

      <div class="lens column" id="lensColumn">
        <div class="lens-label"><span class="n">✦</span>このカードにまつわる小話</div>
        <div class="lens-box column">
          <div class="lens-loading" id="loadColumn">受け取り中…</div>
          <div class="lens-text" id="textColumn" style="display:none;"></div>
        </div>
      </div>

      <button class="again-btn" id="againBtn" onclick="reset()">✦ もう一度引く ✦</button>

      <div class="instagram-link">
        <a href="https://www.instagram.com/awaikeiko" target="_blank" rel="noopener">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
          </svg>
          @awaikeiko
        </a>
      </div>
    </div>
  </div>

  <script src="../cards-data.js"></script>
  <script>
    const API_ENDPOINT = 'https://fortune-five-psi.vercel.app/api/oracle';

    function buildSvg(card) {
      if (card.image) {
        return `<image href="../${card.image}" width="200" height="320" preserveAspectRatio="xMidYMid slice"/>`;
      }
      const [c1, c2] = card.gradStops;
      const gid = 'g' + card.id;
      return `
        <defs>
          <radialGradient id="${gid}" cx="50%" cy="60%" r="75%">
            <stop offset="0%" stop-color="${c2[1]}"/>
            <stop offset="45%" stop-color="${c1[1]}"/>
            <stop offset="100%" stop-color="${c1[0]}"/>
          </radialGradient>
        </defs>
        <rect width="200" height="320" fill="url(#${gid})"/>
        <text x="100" y="138" text-anchor="middle" dominant-baseline="middle"
          font-size="60" fill="${card.symbolColor}" opacity="0.88">${card.symbol}</text>
        <line x1="70" y1="162" x2="130" y2="162" stroke="rgba(255,255,255,0.22)" stroke-width="0.5"/>
        <text x="100" y="182" text-anchor="middle"
          font-family="'Cinzel Decorative',serif" font-size="8.5" letter-spacing="3"
          fill="rgba(255,255,255,0.72)">${card.name}</text>
        <text x="100" y="208" text-anchor="middle"
          font-family="'Cormorant Garamond',serif" font-size="10" font-style="italic"
          fill="rgba(255,255,255,0.52)">${card.subs[0]}</text>
        <text x="100" y="223" text-anchor="middle"
          font-family="'Cormorant Garamond',serif" font-size="10" font-style="italic"
          fill="rgba(255,255,255,0.52)">${card.subs[1]}</text>
      `;
    }

    const typeLabelMap = {
      Sephirot: 'セフィロト（生命の樹）',
      Hebrew: 'ヘブライ文字',
      Rune: 'ルーン文字',
      Norse: '北欧神話の世界',
    };

    let currentDrawId = 0;
    const timers = [];

    function stopTyping() {
      timers.forEach(t => clearInterval(t));
      timers.length = 0;
    }

    function typeInto(elId, loadingElId, text, delay) {
      const el = document.getElementById(elId);
      const loadEl = document.getElementById(loadingElId);
      setTimeout(() => {
        loadEl.style.display = 'none';
        el.style.display = 'block';
        let i = 0;
        const timer = setInterval(() => {
          el.textContent = text.slice(0, i);
          i += 2;
          if (i > text.length) {
            el.textContent = text;
            clearInterval(timer);
          }
        }, 16);
        timers.push(timer);
      }, delay);
    }

    function showError(msg) {
      ['Belief','Background','View','Column'].forEach(key => {
        document.getElementById('load' + key).style.display = 'none';
        const el = document.getElementById('text' + key);
        el.style.display = 'block';
        el.textContent = '';
      });
      const el = document.getElementById('textBelief');
      el.textContent = 'エラー：' + msg;
    }

    async function drawCard() {
      const qEl = document.getElementById('userQ');
      const question = qEl.value.trim();
      if (!question) {
        document.getElementById('qHint').className = 'q-hint show';
        qEl.focus();
        return;
      }
      document.getElementById('qHint').className = 'q-hint';

      const drawId = ++currentDrawId;
      stopTyping();

      const btn = document.getElementById('drawBtn');
      btn.disabled = true;
      btn.textContent = '…';

      const card = CARDS[Math.floor(Math.random() * CARDS.length)];

      document.getElementById('cardSvg').innerHTML = buildSvg(card);
      document.getElementById('cardName').textContent = card.name;
      document.getElementById('cardTypeLabel').textContent = typeLabelMap[card.type] || card.type;
      document.getElementById('yourQ').textContent = '「' + question + '」';

      ['Belief','Background','View','Column'].forEach(key => {
        document.getElementById('load' + key).style.display = 'block';
        document.getElementById('load' + key).textContent = '受け取り中…';
        const el = document.getElementById('text' + key);
        el.style.display = 'none';
        el.textContent = '';
      });

      document.getElementById('inputStage').style.display = 'none';
      const stage = document.getElementById('cardStage');
      stage.className = 'card-stage visible';
      window.scrollTo({ top: 0, behavior: 'smooth' });

      try {
        const resp = await fetch(API_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            mode: 'lens1',
            lang: 'ja',
            question,
            card: {
              name: card.name,
              type: card.type,
              keywords: card.keywords,
              upright: card.upright,
              reversed: card.reversed,
            },
          }),
        });

        const data = await resp.json();
        if (drawId !== currentDrawId) return;
        if (!resp.ok) throw new Error(data.error || '受け取れませんでした');

        typeInto('textBelief', 'loadBelief', data.belief || '（受け取れませんでした）', 0);
        typeInto('textBackground', 'loadBackground', data.background || '（受け取れませんでした）', 200);
        typeInto('textView', 'loadView', data.view || '（受け取れませんでした）', 400);
        typeInto('textColumn', 'loadColumn', data.column || '（受け取れませんでした）', 600);

        btn.disabled = false;
        btn.textContent = '✦ カードを引く ✦';
      } catch (e) {
        if (drawId !== currentDrawId) return;
        showError(e.message);
        btn.disabled = false;
        btn.textContent = '✦ カードを引く ✦';
      }
    }

    function reset() {
      stopTyping();
      currentDrawId++;
      document.getElementById('cardStage').className = 'card-stage';
      document.getElementById('inputStage').style.display = 'block';
      document.getElementById('userQ').value = '';
      document.getElementById('userQ').focus();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
